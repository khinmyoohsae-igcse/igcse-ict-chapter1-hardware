<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE ICT - 1.1.1 Hardware Quiz</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131d31;
            --border-color: #223354;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            color: var(--accent);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-status {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .score-pill {
            background-color: #0c4a6e;
            color: #7dd3fc;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #0284c7;
        }

        .card {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            background-color: #1e293b;
            color: var(--text-main);
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            border: 1px solid #334155;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #283548;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #064e3b !important;
            border-color: #059669 !important;
            color: #ecfdf5 !important;
        }

        .option-btn.incorrect {
            background-color: #7f1d1d !important;
            border-color: #dc2626 !important;
            color: #fee2e2 !important;
        }

        .feedback-box {
            padding: 1.15rem;
            border-radius: 0.85rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-box.correct-feedback {
            background-color: #022c22;
            border: 1px solid #047857;
            color: #a7f3d0;
        }

        .feedback-box.incorrect-feedback {
            background-color: #450a0a;
            border: 1px solid #b91c1c;
            color: #fecdd3;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            padding: 0.85rem 1.75rem;
            border-radius: 0.85rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .results-card {
            text-align: center;
            padding: 3rem 2rem;
        }

        .results-card h2 {
            font-size: 2.25rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .results-card p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hidden {
            display: none !important;
        }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>IGCSE ICT Practice Quiz</h1>
        <p>Topic 1.1.1 Hardware (Physical Components & Devices)</p>
    </header>

    <main>
        <div class="quiz-status">
            <span id="question-counter">Question 1 of 30</span>
            <span id="score-display" class="score-pill">Score: 0</span>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="card">
            <div id="question-box" class="question-text">
                Loading question...
            </div>

            <div id="options-container" class="options-list">
                <!-- Options populated dynamically -->
            </div>

            <div id="feedback-box" class="feedback-box hidden">
                <!-- Feedback populated dynamically -->
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <button id="next-btn" onclick="nextQuestion()" class="btn-primary hidden">Next Question</button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="card results-card hidden">
            <h2>Quiz Completed! 🎉</h2>
            <p id="final-score">You scored X out of 30</p>
            <button onclick="restartQuiz()" class="btn-primary">Restart Quiz</button>
        </div>
    </main>

    <footer>
        IGCSE ICT Revision &bull; Hardware and Software
    </footer>

    <script>
        const questions = [
            {
                question: "What is the general definition of hardware in a computer system?",
                options: [
                    { text: "The set of instructions or programs that run on the computer", isCorrect: false, rationale: "Instructions and programs refer to software, not physical hardware." },
                    { text: "The physical components that make up a typical computer system", isCorrect: true, rationale: "Hardware represents all the tangible, physical parts of a computer system like the keyboard, monitor, and internal circuits." },
                    { text: "Low-level permanent code stored on ROM chips", isCorrect: false, rationale: "This describes firmware." },
                    { text: "Files created by the user during applications work", isCorrect: false, rationale: "User files are data documents, not hardware." }
                ]
            },
            {
                question: "Which analogy best explains the relationship between hardware and software?",
                options: [
                    { text: "Hardware is the road, software is the car", isCorrect: false, rationale: "That is not the standard textbook analogy." },
                    { text: "Hardware is the pages and ink of a book, software is the words written on them", isCorrect: true, rationale: "Just like pages and ink form the physical book, hardware forms the physical computer; the words represent software." },
                    { text: "Hardware is the electricity, software is the light bulb", isCorrect: false, rationale: "That is an electrical analogy, not the standard textbook comparison." },
                    { text: "Hardware is the operating system, software is the application", isCorrect: false, rationale: "Both are software categories." }
                ]
            },
            {
                question: "Which of the following is classified as an input device?",
                options: [
                    { text: "Monitor", isCorrect: false, rationale: "A monitor is an output device." },
                    { text: "Plotter", isCorrect: false, rationale: "A plotter is an output device." },
                    { text: "Keyboard", isCorrect: true, rationale: "A keyboard is a primary manual input device used to enter data into a computer." },
                    { text: "Loudspeaker", isCorrect: false, rationale: "A loudspeaker is an output device." }
                ]
            },
            {
                question: "Which of the following is classified as an output device?",
                options: [
                    { text: "Mouse", isCorrect: false, rationale: "A mouse is an input device." },
                    { text: "Microphone", isCorrect: false, rationale: "A microphone is an input device." },
                    { text: "Camera", isCorrect: false, rationale: "A camera is an input device." },
                    { text: "Printer", isCorrect: true, rationale: "A printer is an output device used to produce hard copies of digital data." }
                ]
            },
            {
                question: "What is the primary function of the motherboard?",
                options: [
                    { text: "To act as a central hub connecting all internal and external hardware components together", isCorrect: true, rationale: "The motherboard provides electrical pathways and physical slots linking the CPU, memory, and expansion cards." },
                    { text: "To store permanent startup BIOS instructions", isCorrect: false, rationale: "BIOS instructions are stored on ROM chips." },
                    { text: "To convert analogue sensor signals into binary data", isCorrect: false, rationale: "Signal conversion is handled by an ADC." },
                    { text: "To translate high-level programming languages into machine code", isCorrect: false, rationale: "Translation is performed by a compiler." }
                ]
            },
            {
                question: "Which component of the Central Processing Unit (CPU) performs calculations and logical comparisons?",
                options: [
                    { text: "Control Unit (CU)", isCorrect: false, rationale: "The CU directs instructions and controls input/output operations." },
                    { text: "Arithmetic and Logic Unit (ALU)", isCorrect: true, rationale: "The ALU carries out arithmetic operations (math) and logical decisions (comparisons)." },
                    { text: "Read-Only Memory (ROM)", isCorrect: false, rationale: "ROM is internal memory, not part of the CPU." },
                    { text: "Network Interface Card (NIC)", isCorrect: false, rationale: "The NIC handles network connectivity." }
                ]
            },
            {
                question: "What is the role of the Control Unit (CU) inside the CPU?",
                options: [
                    { text: "To store temporary data currently in use", isCorrect: false, rationale: "Temporary storage is handled by RAM." },
                    { text: "To fetch, decode, and execute instructions and manage data flow", isCorrect: true, rationale: "The CU coordinates all CPU activities and manages the execution cycle." },
                    { text: "To render 3D graphics onto the screen", isCorrect: false, rationale: "Graphics rendering is managed by the graphics card/GPU." },
                    { text: "To permanently save user documents", isCorrect: false, rationale: "Permanent file saving is done on backing storage." }
                ]
            },
            {
                question: "Which of the following describes Random Access Memory (RAM)?",
                options: [
                    { text: "Volatile memory where currently running programs and data are temporarily stored", isCorrect: true, rationale: "RAM is volatile, meaning it loses all data when power is turned off." },
                    { text: "Non-volatile memory used to store the computer boot sequence", isCorrect: false, rationale: "Permanent boot instructions are stored in ROM." },
                    { text: "Magnetic storage used for long-term file archiving", isCorrect: false, rationale: "Long-term archiving is done on HDDs, SSDs, or tape." },
                    { text: "An integrated circuit used exclusively for audio processing", isCorrect: false, rationale: "Audio processing is done by a sound card." }
                ]
            },
            {
                question: "What is a key characteristic of Read-Only Memory (ROM)?",
                options: [
                    { text: "Its contents are erased whenever the computer is powered down", isCorrect: false, rationale: "Erasure upon power loss describes volatile RAM." },
                    { text: "It can be freely written to and modified by the user at any time", isCorrect: false, rationale: "ROM cannot be altered by normal user operations." },
                    { text: "It stores permanent data such as the BIOS and boot-up instructions", isCorrect: true, rationale: "ROM is non-volatile memory that retains its contents permanently even without power." },
                    { text: "It provides network connectivity via a physical Ethernet cable", isCorrect: false, rationale: "Network connection is handled by an NIC." }
                ]
            },
            {
                question: "What is the main purpose of a graphics card (GPU)?",
                options: [
                    { text: "To process and render visual images and video output to a display monitor", isCorrect: true, rationale: "Graphics cards handle complex image rendering and send video signals to screens." },
                    { text: "To connect the computer to a Local Area Network (LAN)", isCorrect: false, rationale: "Network connection is managed by an NIC." },
                    { text: "To convert physical sound waves into electrical digital recordings", isCorrect: false, rationale: "Audio conversion is handled by sound cards." },
                    { text: "To defragment magnetic disk storage sectors", isCorrect: false, rationale: "Disk defragmentation is a utility software task." }
                ]
            },
            {
                question: "Which hardware component connects a computer to a network and contains a unique hard-coded MAC address?",
                options: [
                    { text: "Sound card", isCorrect: false, rationale: "A sound card handles audio production." },
                    { text: "Network Interface Card (NIC)", isCorrect: true, rationale: "An NIC enables wired or wireless network connection and stores a unique MAC address." },
                    { text: "Arithmetic and Logic Unit", isCorrect: false, rationale: "The ALU is an internal CPU component." },
                    { text: "Graphics card", isCorrect: false, rationale: "A graphics card manages display output." }
                ]
            },
            {
                question: "Which storage device relies on rotating magnetic platters and read/write heads?",
                options: [
                    { text: "Solid-State Drive (SSD)", isCorrect: false, rationale: "SSDs use flash memory with no moving parts." },
                    { text: "Hard Disk Drive (HDD)", isCorrect: true, rationale: "HDDs use magnetic platters to store data read by moving heads." },
                    { text: "Read-Only Memory (ROM)", isCorrect: false, rationale: "ROM is semiconductor chip memory." },
                    { text: "Random Access Memory (RAM)", isCorrect: false, rationale: "RAM is volatile electronic memory." }
                ]
            },
            {
                question: "What is a microprocessor?",
                options: [
                    { text: "A temporary storage chip holding active applications", isCorrect: false, rationale: "Temporary storage is RAM." },
                    { text: "A single integrated circuit that functions as the CPU", isCorrect: true, rationale: "A microprocessor is a complete central processing unit built onto a single silicon chip." },
                    { text: "A specialized circuit board for connecting network cables", isCorrect: false, rationale: "Network cabling connects via an NIC port." },
                    { text: "A battery-powered chip maintaining the system date and time", isCorrect: false, rationale: "Date and time are kept by a CMOS chip." }
                ]
            },
            {
                question: "What is the function of CMOS (Complementary Metal Oxide Semiconductor) in a computer?",
                options: [
                    { text: "To execute high-level programming language instructions", isCorrect: false, rationale: "Instruction execution is done by the CPU." },
                    { text: "To store BIOS configuration settings, system date, and time using a small battery", isCorrect: true, rationale: "CMOS is a small battery-backed non-volatile memory chip maintaining system startup settings." },
                    { text: "To amplify audio signals before sending them to loudspeakers", isCorrect: false, rationale: "Audio amplification is done by an amplifier or sound card." },
                    { text: "To translate analogue physical inputs into digital numbers", isCorrect: false, rationale: "Analogue conversion is done by an ADC." }
                ]
            },
            {
                question: "What is backing storage primarily used for?",
                options: [
                    { text: "Temporarily holding instructions currently being executed by the CPU", isCorrect: false, rationale: "Temporary execution holding is RAM." },
                    { text: "Permanently storing large amounts of data, applications, and operating systems", isCorrect: true, rationale: "Backing storage provides non-volatile long-term retention of files and programs." },
                    { text: "Running initial startup hardware diagnostic checks", isCorrect: false, rationale: "Startup checks are run by BIOS stored in ROM." },
                    { text: "Converting digital output into physical analogue signals", isCorrect: false, rationale: "Signal conversion is done by a DAC." }
                ]
            },
            {
                question: "What type of data can a computer processor understand and process directly?",
                options: [
                    { text: "Analogue data", isCorrect: false, rationale: "Analogue data is continuous physical data requiring conversion." },
                    { text: "Digital binary data (consisting of 0s and 1s)", isCorrect: true, rationale: "Computers operate using electronic binary signals representing 0 and 1." },
                    { text: "Audio sound wave frequencies", isCorrect: false, rationale: "Audio waves are continuous physical phenomena." },
                    { text: "High-level programming source code", isCorrect: false, rationale: "Source code must be compiled into binary machine code first." }
                ]
            },
            {
                question: "How is analogue data characterized?",
                options: [
                    { text: "It consists of discrete, discontinuous digital steps", isCorrect: false, rationale: "Discrete steps describe digital data." },
                    { text: "It changes smoothly and continuously with an infinite number of possible values", isCorrect: true, rationale: "Analogue data represents physical quantities like temperature or sound varying continuously." },
                    { text: "It is stored exclusively in solid-state flash memory chips", isCorrect: false, rationale: "Flash memory stores digital binary data." },
                    { text: "It can only be processed directly by the arithmetic and logic unit", isCorrect: false, rationale: "CPUs process digital binary signals." }
                ]
            },
            {
                question: "What hardware component is required to convert physical analogue signals into digital data for a computer?",
                options: [
                    { text: "Digital to Analogue Converter (DAC)", isCorrect: false, rationale: "A DAC converts digital data into analogue output." },
                    { text: "Analogue to Digital Converter (ADC)", isCorrect: true, rationale: "An ADC samples physical analogue inputs and converts them into binary digital values." },
                    { text: "Central Processing Unit (CPU)", isCorrect: false, rationale: "The CPU executes instructions rather than converting signal types." },
                    { text: "Network Interface Card (NIC)", isCorrect: false, rationale: "An NIC handles network data packets." }
                ]
            },
            {
                question: "When a computer needs to control a physical device (like a heater or motor) using digital output signals, what converter is required?",
                options: [
                    { text: "Analogue to Digital Converter (ADC)", isCorrect: false, rationale: "An ADC converts inputs into digital format." },
                    { text: "Digital to Analogue Converter (DAC)", isCorrect: true, rationale: "A DAC converts digital computer output into analogue electrical control signals." },
                    { text: "Graphics card", isCorrect: false, rationale: "A graphics card sends visual data to monitors." },
                    { text: "Sound card", isCorrect: false, rationale: "A sound card handles audio signals." }
                ]
            },
            {
                question: "What is an embedded system?",
                options: [
                    { text: "A computer system built into a larger device to perform specific dedicated control tasks", isCorrect: true, rationale: "Embedded systems control specific devices like washing machines, microwave ovens, or car engines." },
                    { text: "A general-purpose operating system installed on a desktop PC", isCorrect: false, rationale: "Desktop operating systems are general-purpose platforms." },
                    { text: "A removable USB flash drive used for backing up documents", isCorrect: false, rationale: "USB drives are portable backing storage media." },
                    { text: "A software compiler used for high-level programming languages", isCorrect: false, rationale: "A compiler is system software." }
                ]
            },
            {
                question: "Which of the following devices is an example of an embedded system?",
                options: [
                    { text: "A high-end desktop gaming PC", isCorrect: false, rationale: "A gaming PC is a general-purpose computer." },
                    { text: "An automatic washing machine control unit", isCorrect: true, rationale: "A washing machine contains a dedicated microprocessor controlling its wash cycles." },
                    { text: "A standalone laser printer", isCorrect: false, rationale: "Printers are peripheral output devices." },
                    { text: "A commercial cloud database server", isCorrect: false, rationale: "A cloud server is a general-purpose server computer." }
                ]
            },
            {
                question: "What is the main difference in volatility between RAM and Backing Storage (like an SSD)?",
                options: [
                    { text: "RAM is non-volatile, while backing storage is volatile", isCorrect: false, rationale: "This is the exact opposite of reality." },
                    { text: "RAM is volatile (loses data when powered off), while backing storage is non-volatile (retains data)", isCorrect: true, rationale: "RAM requires continuous power to hold data, whereas storage drives keep data safely without power." },
                    { text: "Both RAM and backing storage are completely volatile", isCorrect: false, rationale: "Backing storage is non-volatile." },
                    { text: "Both RAM and backing storage are completely non-volatile", isCorrect: false, rationale: "RAM is volatile." }
                ]
            },
            {
                question: "Which of the following best compares the access speed and capacity of RAM versus Backing Storage?",
                options: [
                    { text: "RAM has much faster access speed and smaller capacity than backing storage", isCorrect: true, rationale: "RAM operates at electronic speeds directly with the CPU but has smaller capacity compared to large backing storage drives." },
                    { text: "RAM has much slower access speed and larger capacity than backing storage", isCorrect: false, rationale: "RAM is much faster and smaller in capacity than backing storage." },
                    { text: "RAM and backing storage have identical access speeds and capacities", isCorrect: false, rationale: "Their speeds and capacities differ significantly." },
                    { text: "Backing storage can be accessed directly by the CPU faster than RAM", isCorrect: false, rationale: "The CPU cannot execute code directly from backing storage without loading it into RAM first." }
                ]
            },
            {
                question: "Which of the following input devices is commonly used at a Point of Sale (POS) terminal in a supermarket to read product codes?",
                options: [
                    { text: "Barcode reader", isCorrect: true, rationale: "Barcode readers optically scan printed vertical lines on products at checkout." },
                    { text: "Graph plotter", isCorrect: false, rationale: "A plotter is a large-format output device." },
                    { text: "Actuator", isCorrect: false, rationale: "An actuator is an output device that creates physical movement." },
                    { text: "Microphone", isCorrect: false, rationale: "A microphone captures audio input." }
                ]
            },
            {
                question: "What is the function of an actuator in a computer-controlled system?",
                options: [
                    { text: "To measure physical environmental conditions like temperature", isCorrect: false, rationale: "Measuring conditions is done by sensors." },
                    { text: "To convert digital computer control signals into physical action or movement", isCorrect: true, rationale: "Actuators (like motors, heaters, or valves) perform physical actions based on signals from a microprocessor." },
                    { text: "To store permanent backup files securely", isCorrect: false, rationale: "File storage is handled by backing storage devices." },
                    { text: "To display graphical user interfaces on a screen", isCorrect: false, rationale: "Displaying interfaces is done by monitors." }
                ]
            },
            {
                question: "Which device allows a user to point at options on a display screen by touching it with a finger or stylus?",
                options: [
                    { text: "Touch screen", isCorrect: true, rationale: "A touch screen functions as both an input device (touch detection) and output device (display)." },
                    { text: "Dot matrix printer", isCorrect: false, rationale: "A dot matrix printer produces impact text output." },
                    { text: "Magnetic stripe reader", isCorrect: false, rationale: "A magnetic stripe reader swipes card strips." },
                    { text: "Optical Mark Reader (OMR)", isCorrect: false, rationale: "An OMR detects pencil marks on standardized test forms." }
                ]
            },
            {
                question: "Which printer type is best suited for producing carbon-copy multi-part invoices due to its impact pins striking an inked ribbon?",
                options: [

                    { text: "Inkjet printer", isCorrect: false, rationale: "Inkjet printers spray liquid ink droplets; they are non-impact." },

                    { text: "Magnetic stripe reader", isCorrect: true, rationale: "Magnetic stripe readers scan the magnetic tape on cards containing stored user data." },

                    { text: "Graphics tablet", isCorrect: false, rationale: "A graphics tablet is used by artists for drawing input." },

        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            optionsContainer.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const allOptionButtons = optionsContainer.children;

            q.options.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (idx === selectedIndex) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            const selectedOpt = q.options[selectedIndex];
            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
</html>
